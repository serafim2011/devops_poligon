events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    upstream courses_api {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeouts=30s;
        server 127.0.0.1:3001 max_fails=3 fail_timeouts=30;
    }
    server {
        listen 80;
        server_name skill-hub.ru www.skill-hub.ru;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 http://$host$request_uri;
        }
    }
    server {
        listen 443 ssl http2;
        server_name skill-hub.ru www.skill-hub.ru;
        ssl_certificate /etc/letsencrypt/live/skill-hub.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/skill-hub.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        client_max_body_size 100M;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        location /static/ {
            alias /var/www/skillhub/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }
        location / {
                limit_req zone=med_limit burst=40 nodelay;
                proxy_pass http://courses_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
    }
}